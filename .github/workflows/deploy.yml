name: Deploy friedhöfe.online to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
      - hauptsächlich
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Confirm static site
        run: |
          test -f index.html
          echo "Static root OK. Cloudflare Pages Git integration deploys this repo to friedhöfe.online."
